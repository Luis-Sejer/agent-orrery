<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:"Instrument Serif";src:url(../fonts/instrument-serif-400.woff2)}
@font-face{font-family:Inter;font-weight:400;src:url(../fonts/inter-400.woff2)}
@font-face{font-family:Inter;font-weight:500;src:url(../fonts/inter-500.woff2)}
@font-face{font-family:Inter;font-weight:400;font-style:italic;src:url(../fonts/inter-400-italic.woff2)}
*{box-sizing:border-box}
html,body{margin:0;overflow:hidden;-webkit-font-smoothing:antialiased}
body{width:100vw;height:100vh;position:relative;color:#162925;font-family:Inter,sans-serif;
  background:radial-gradient(circle at 80% 50%,rgba(52,149,95,.09),transparent 46%),#f8f9fa}
.orrery{position:absolute;width:148vh;height:148vh;left:calc(84vw - 74vh);top:-24vh}
.copy{position:absolute;left:7.5vw;top:50%;transform:translateY(-52%);width:46vw}
.logo{display:flex;align-items:center;gap:2.1vh}
.logo svg{width:11vh;height:11vh;flex:none}
.logo b{font:400 12.6vh/1 "Instrument Serif",serif;letter-spacing:-.02em;white-space:nowrap}
.logo i{color:#5b6763;font-size:3.6vh;margin-left:1.4vh;align-self:flex-end;margin-bottom:2.2vh;white-space:nowrap}
p{margin:4.4vh 0 0;font-size:4.3vh;line-height:1.38;color:#3b4a46;max-width:19em}
.url{margin-top:3.4vh;font-size:3.6vh;color:#236b45;font-weight:500}
.foot{position:absolute;left:7.5vw;bottom:7vh;font-size:2.7vh;color:#5b6763;display:flex;gap:1.2vh;align-items:center}
/* Video cards are 16:10, so the name and the orrery both scale down to keep clear of each other. */
@media (max-aspect-ratio:9/5){
  .orrery{width:120vh;height:120vh;left:calc(100vw - 72vh);top:-10vh}
  .logo svg{width:9vh;height:9vh}.logo b{font-size:10.4vh}.logo i{font-size:3vh;margin-bottom:1.8vh}
  p{font-size:3.7vh}.url{font-size:3.2vh}
}
</style></head><body>
<svg class="orrery" id="orrery" aria-hidden="true"></svg>
<div class="copy">
  <div class="logo"><svg viewBox="0 0 32 32"><mask id="m" maskUnits="userSpaceOnUse" x="0" y="0" width="32" height="32"><rect width="32" height="32" fill="#fff"/><circle cx="26.25" cy="5.75" r="3.6" fill="#000"/></mask><g fill="none" stroke="#34955f" stroke-width="1.5" stroke-linecap="round" mask="url(#m)"><circle cx="16" cy="16" r="14.5" pathLength="40" stroke-dasharray="0.67 1.33" transform="rotate(-84 16 16)"/><circle cx="16" cy="16" r="10" pathLength="28" stroke-dasharray="0.67 1.33" stroke-opacity="0.6" transform="rotate(-80 16 16)"/></g><circle cx="16" cy="16" r="5.25" fill="#162925"/><circle cx="26.25" cy="5.75" r="2.4" fill="#34955f"/></svg><b>Agent Orrery</b><i>by sejer</i></div>
  <p>A live map of your Claude Code agents,<br>and what’s waiting on you.</p>
</div>
<div class="foot">github.com/Luis-Sejer/agent-orrery</div>
<script src="../orrery.js"></script>
<script>
// ?card=end turns the banner into the launch video's closing card.
if (new URLSearchParams(location.search).get('card') === 'end') {
  document.querySelector('.copy p').innerHTML = 'Open source, read-only,<br>and local to your machine.'
  document.querySelector('.foot').textContent = 'luis-sejer.github.io/agent-orrery'
  document.querySelector('.copy').insertAdjacentHTML('beforeend', '<p class="url">github.com/Luis-Sejer/agent-orrery</p>')
}
</script>
<script>Orrery.mount(document.getElementById('orrery'), { t: Number(new URLSearchParams(location.search).get('t') ?? 10) })</script>
</body></html>
