name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to commits, not tags, so a moved tag can't change what runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: agent-orrery:ci
      # A port other than the default, to catch a mismatch between the port and the Host check.
      - name: Serve the page from the image
        run: |
          docker run -d --name agent-orrery -e AGENT_ORRERY_PORT=4788 -p 127.0.0.1:4788:4788 --read-only --cap-drop ALL agent-orrery:ci
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4788/ || true)
            [ "$status" = 200 ] && exit 0
            sleep 1
          done
          docker logs agent-orrery
          exit 1

  menubar:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: swift build
        working-directory: menubar
