services:
  agent-orrery:
    build: .
    image: agent-orrery:local
    container_name: agent-orrery
    # Comes back after a crash and whenever Docker Desktop starts, so the page is always there.
    restart: unless-stopped
    # Published on this machine only; nothing on the network can reach it.
    # The same port inside and out: the server only answers requests addressed to its own port.
    ports:
      - 127.0.0.1:${AGENT_ORRERY_PORT:-4777}:${AGENT_ORRERY_PORT:-4777}
    # Your session files are readable only by you, so the server runs as your user (501 on most Macs).
    user: ${AGENT_ORRERY_UID:-501}:${AGENT_ORRERY_GID:-20}
    environment:
      # Same home path as the host, so paths in transcripts resolve inside the container.
      HOME: ${HOME}
      AGENT_ORRERY_PORT: ${AGENT_ORRERY_PORT:-4777}
      AGENT_ORRERY_WINDOW_HOURS: ${AGENT_ORRERY_WINDOW_HOURS:-6}
      AGENT_ORRERY_WAITING_HOURS: ${AGENT_ORRERY_WAITING_HOURS:-24}
      # Its own state (settings, dismissed sessions): the one folder it writes to.
      AGENT_ORRERY_DATA_DIR: /data
      # More Claude Code folders to show beside yours, comma-separated; each must be inside a mounted folder.
      AGENT_ORRERY_EXTRA_CLAUDE_DIRS: ${AGENT_ORRERY_EXTRA_CLAUDE_DIRS:-}
      # Defaults for settings nobody has changed yet; Settings → "Copy these settings for .env" writes them.
      AGENT_ORRERY_NOTIFICATIONS: ${AGENT_ORRERY_NOTIFICATIONS:-}
      AGENT_ORRERY_VIEW: ${AGENT_ORRERY_VIEW:-}
      AGENT_ORRERY_ARRANGEMENT: ${AGENT_ORRERY_ARRANGEMENT:-}
      AGENT_ORRERY_THEME: ${AGENT_ORRERY_THEME:-}
      AGENT_ORRERY_AGENTS_LAYOUT: ${AGENT_ORRERY_AGENTS_LAYOUT:-}
      AGENT_ORRERY_HIDE_FINISHED: ${AGENT_ORRERY_HIDE_FINISHED:-}
      AGENT_ORRERY_WORKTREE_ROOMS: ${AGENT_ORRERY_WORKTREE_ROOMS:-}
      AGENT_ORRERY_CLEAN_VIEW: ${AGENT_ORRERY_CLEAN_VIEW:-}
      AGENT_ORRERY_PAUSE_MOTION: ${AGENT_ORRERY_PAUSE_MOTION:-}
      AGENT_ORRERY_VOICE: ${AGENT_ORRERY_VOICE:-}
    volumes:
      # Settings and dismissed sessions, shared by every browser. Everything else is mounted read-only.
      - ${AGENT_ORRERY_DATA:-./data}:/data
      - ${HOME}/.claude/projects:${HOME}/.claude/projects:ro
      - ${HOME}/.claude/plans:${HOME}/.claude/plans:ro
      # What each running session is doing, in Claude Code's own words. Only its <pid>.json files are
      # opened; the folder's key files are never read.
      - ${HOME}/.claude/sessions:${HOME}/.claude/sessions:ro
      # Your plan's usage, if you set up the status line bridge (INSTALL.md, "Plan usage").
      - ${HOME}/.claude/orrery:${HOME}/.claude/orrery:ro
      # Only read to tell which folders are git repositories.
      - ${AGENT_ORRERY_CODE_DIR:-${HOME}/Documents/GitHub}:${AGENT_ORRERY_CODE_DIR:-${HOME}/Documents/GitHub}:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
